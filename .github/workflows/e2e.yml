name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # CLI は devDependencies で固定しているものを使う（latest だと Postgres イメージが変わり、
      # anon への既定権限が無くなって PostgREST が 401 permission denied を返す）。
      - name: Start Supabase
        run: npx supabase start

      - name: Reset database
        run: npx supabase db reset

      - name: Read anon key
        run: echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
